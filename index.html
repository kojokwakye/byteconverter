<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="js.js" defer></script>
    <title>byte converter</title>
  </head>
  <body>
    <h1>byte converter</h1>

    <div class="form-table">
      <form action="">
        <div class="byteunit">
          <input id="byte" type="number" class="unit byte-input" value="0" />
          <label for="" class="label">bytes</label>
        </div>
        <div class="megabyte">
          <input id="megabyte" type="number" class="unit megabyte-input" value="0" readonly/>
          <label for="" class="label">megabyte</label>
        </div>
        <div class="gigabyteunit">
          <input id="gigabyte" type="number" class="unit gigabyte-input" value="0" readonly />
          <label for="" class="label">gigabyte</label>
        </div>
      </form>
    </div>
  </body>
</html>
