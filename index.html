<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="js.js" defer></script>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon_io/favicon-16x16.png"
    />
    <link rel="manifest" href="/favicon_io/site.webmanifest" />
    <title>byte converter</title>
  </head>
  <body>
    <div class="menubtn">
      <a href="#bytepage" class="header1 active" id="bytetitle"
        >byte converter</a
      >
      <!-- /
      <a href="#minutespage" class="header1" id="minutetitle"
        >minutes converter</a
      > -->
    </div>

    <div class="form-table">
      <form action="">
        <div class="row">
          <div class="byteunit">
            <input id="byte1" type="number" class="unit byte-input" />
            <label class="label">bytes</label>
          </div>
          <div class="megabyte">
            <input id="megabyte1" type="number" class="unit" readonly />
            <label class="label">megabyte/s</label>
          </div>
          <div class="gigabyte">
            <input id="gigabyte1" type="number" class="unit" readonly />
            <label class="label">gigabyte/s</label>
          </div>
        </div>

        <div class="row">
          <div class="byteunit">
            <input id="byte2" type="number" class="unit byte-input" />
            <label class="label">bytes</label>
          </div>
          <div class="megabyte">
            <input id="megabyte2" type="number" class="unit" readonly />
            <label class="label">megabyte/s</label>
          </div>
          <div class="gigabyte">
            <input id="gigabyte2" type="number" class="unit" readonly />
            <label class="label">gigabyte/s</label>
          </div>
        </div>

        <div class="row">
          <div class="byteunit">
            <input id="byte3" type="number" class="unit byte-input" />
            <label class="label">bytes</label>
          </div>
          <div class="megabyte">
            <input id="megabyte3" type="number" class="unit" readonly />
            <label class="label">megabyte/s</label>
          </div>
          <div class="gigabyte">
            <input id="gigabyte3" type="number" class="unit" readonly />
            <label class="label">gigabyte/s</label>
          </div>
        </div>

        <div class="row">
          <div class="byteunit">
            <input id="byte4" type="number" class="unit byte-input" />
            <label class="label">bytes</label>
          </div>
          <div class="megabyte">
            <input id="megabyte4" type="number" class="unit" readonly />
            <label class="label">megabyte/s</label>
          </div>
          <div class="gigabyte">
            <input id="gigabyte4" type="number" class="unit" readonly />
            <label class="label">gigabyte/s</label>
          </div>
        </div>

        <div class="row">
          <div class="byteunit">
            <input id="byte5" type="number" class="unit byte-input" />
            <label class="label">bytes</label>
          </div>
          <div class="megabyte">
            <input id="megabyte5" type="number" class="unit" readonly />
            <label class="label">megabyte/s</label>
          </div>
          <div class="gigabyte">
            <input id="gigabyte5" type="number" class="unit" readonly />
            <label class="label">gigabyte/s</label>
          </div>
        </div>
        <div class="row total-row">
          <div class="totalmb">
            <!-- <span class="total-label">Total mB</span> -->
            <input id="total-mb" type="number" class="unit" readonly />
            <label class="label">total mb</label>
          </div>
          <div class="totalgb">
            <!-- <span class="total-label">Total GB</span> -->
            <input id="total-gb" type="number" class="unit" readonly />
            <label class="label">total gb</label>
          </div>
          <!-- <button class="refresh">
            <a
              class="refresh"
              href="#"
              onclick="
                location.href = document.referrer;
                return false;
              "
              >refresh</a
            >
          </button> -->
        </div>
        <div class="refreshbutton">
          <button class="refresh">
            <a
              class="refresh"
              href="#"
              onclick="
                location.href = document.referrer;
                return false;
              "
              >refresh</a
            >
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
